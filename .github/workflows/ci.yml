name: Skills CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement requirements-ci.lock
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate JSON metadata
        run: |
          find . -path ./.git -prune -o -path ./node_modules -prune -o \
            -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate skill entrypoints
        run: python scripts/validate_skill_catalog.py
